{% extends "admin/base_site.html" %}
{% load admin_urls %}

{% block breadcrumbs %}
<div class="breadcrumbs">
  <a href="{% url 'admin:index' %}">Home</a> &rsaquo;
  <a href="{% url opts|admin_urlname:'changelist' %}">Gallery images</a> &rsaquo;
  Upload multiple photos
</div>
{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="submit" value="Upload photos" class="default">
</form>
{% endblock %}
